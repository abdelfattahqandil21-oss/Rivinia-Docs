<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="stack-picker" role="group" aria-label="Stylesheet stack">
      <button type="button" data-stack="css" aria-pressed="true">CSS</button>
      <button type="button" data-stack="tailwind" aria-pressed="false">Tailwind v4</button>
      <button type="button" data-stack="bootstrap" aria-pressed="false">Bootstrap 5.3</button>
      <button type="button" data-stack="sass" aria-pressed="false">Sass</button>
      <button type="button" data-stack="less" aria-pressed="false">Less</button>
    </div>
    <pre id="entry" aria-live="polite">@import '@rivinia/theme';</pre>
    <p class="note">Base stylesheet preview.</p>
    <div class="card">
      <strong>Shared theme tokens</strong>
      <div class="token-list" aria-label="Theme token samples">
        <span class="token-chip token-bg">Background</span>
        <span class="token-chip token-fg">Text</span>
        <span class="token-chip token-border">Border</span>
        <span class="token-chip token-accent">Accent</span>
      </div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
