<div class="example-field">
  <rv-datepicker
    [(value)]="selectedDate"
    [locale]="locale()"
    format="medium"
    [label]="'showcase.datepicker.label' | rvTranslate"
    [placeholder]="'showcase.datepicker.placeholder' | rvTranslate"
    [clearable]="true"
  />
  <p class="example-feedback" aria-live="polite" aria-atomic="true">
    {{ 'showcase.datepicker.selected' | rvTranslate }}: {{ selectedDateLabel() }}
  </p>
</div>
