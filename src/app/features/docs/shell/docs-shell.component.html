<div class="docs-layout" [class.sidebar-collapsed]="sidebar.collapsed()">
  <aside
    app-docs-sidebar
    id="docs-sidebar-desktop"
    class="docs-sidebar"
    [attr.inert]="sidebar.collapsed() ? '' : null"
  ></aside>

  <div class="docs-content-column">
    <button
      app-docs-sidebar-toggle
      class="docs-sidebar-toggle"
      [label]="sidebar.collapsed() ? expandSidebarLabel() : collapseSidebarLabel()"
      controls="docs-sidebar-desktop"
      [expanded]="!sidebar.collapsed()"
    ></button>
    <details class="rail-disclosure">
      <summary>{{ i18n.translate('docs.onThisPage') }}</summary>
      <nav app-docs-page-rail></nav>
    </details>
    <router-outlet />
  </div>

  <aside class="docs-page-rail">
    <nav app-docs-page-rail></nav>
  </aside>
</div>
<dialog
  app-docs-menu-dialog
  id="rv-docs-menu-dialog"
  class="docs-sidebar-dialog"
  aria-labelledby="docs-menu-title"
></dialog>
<p class="sr-only" aria-live="polite" aria-atomic="true">{{ page.announcement() }}</p>
