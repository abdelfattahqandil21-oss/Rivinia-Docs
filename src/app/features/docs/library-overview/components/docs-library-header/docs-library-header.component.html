@if (packageName()) {
  <p lang="en" dir="ltr">
    {{ packageName() }}
    <span class="version-badge"
      ><span class="sr-only">{{ versionText() }} </span>{{ versionLabel() }}</span
    >
  </p>
}
<div [attr.lang]="contentLanguage()" dir="auto">
  <app-page-header [title]="title()" [lead]="description()" />
</div>
@if (!packageName()) {
  <span class="version-badge" lang="en" dir="ltr">{{ versionLabel() }}</span>
}
<ul class="entry-point-chips" [attr.aria-label]="entryPointsLabel()">
  @for (entryPoint of entryPoints(); track entryPoint) {
    <li>
      <code dir="ltr">{{ entryPoint }}</code>
    </li>
  }
</ul>
