<article class="docs-page-content docs-hub">
  <app-page-header [title]="title()" [lead]="lead()" />

  <app-docs-package-filter
    class="hub-filter"
    inputId="docs-hub-package-filter"
    [resultCount]="search.visiblePackages().length"
    [(value)]="search.query"
  />

  <a class="getting-started-row" [routerLink]="gettingStartedLink">
    <strong>{{ i18n.translate('docs.gettingStarted') }}</strong>
    <span aria-hidden="true">→</span>
  </a>

  @for (group of groups; track group) {
    @if (packagesForGroup(group).length) {
      <section
        app-docs-hub-package-group
        class="package-group"
        [group]="group"
        [packages]="packagesForGroup(group)"
        [attr.aria-labelledby]="'group-' + group"
      ></section>
    }
  }
</article>
