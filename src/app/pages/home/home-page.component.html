<section class="w-full px-4 py-16 sm:px-6 md:py-24 lg:px-8">
  <app-page-header [eyebrow]="eyebrow()" [title]="title()" [lead]="lead()">
    <div class="mt-8 flex flex-wrap items-center gap-3">
      <a
        routerLink="/docs"
        class="inline-flex h-11 items-center rounded-lg bg-rv-accent px-5 text-sm font-semibold text-rv-bg transition-opacity duration-150 hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rv-accent motion-reduce:transition-none"
      >
        {{ primaryCta() }}
      </a>
      <a
        routerLink="/components"
        class="inline-flex h-11 items-center rounded-lg border border-rv-border px-5 text-sm font-semibold text-rv-fg transition-colors duration-150 hover:border-rv-accent hover:text-rv-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rv-accent motion-reduce:transition-none"
      >
        {{ secondaryCta() }}
      </a>
    </div>
  </app-page-header>

  <div
    class="mt-16 h-px w-full bg-gradient-to-r from-rv-accent/60 via-rv-brand/40 to-transparent"
  ></div>
</section>
