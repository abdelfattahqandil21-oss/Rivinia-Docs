<div class="table-wrap">
  <rv-table
    [columns]="columns()"
    [rows]="table.pageRows()"
    [sort]="table.sorting()"
    (sortChange)="table.sorting.set($event)"
    [ariaLabel]="'showcase.table.label' | rvTranslate"
    density="comfortable"
  />
  <nav class="pagination" [attr.aria-label]="'showcase.table.pagination' | rvTranslate">
    <button type="button" [disabled]="table.page() === 0" (click)="previousPage()">
      {{ 'showcase.table.previous' | rvTranslate }}
    </button>
    <span aria-live="polite">{{
      'showcase.table.pageInfo'
        | rvTranslate: { count: table.total(), page: table.page() + 1, pageCount: pageCount() }
    }}</span>
    <button type="button" [disabled]="table.page() + 1 >= pageCount()" (click)="nextPage()">
      {{ 'showcase.table.next' | rvTranslate }}
    </button>
    <label
      >{{ 'showcase.table.rowsPerPage' | rvTranslate }}
      <select [value]="pageSize()" (change)="changePageSize($any($event.target).value)">
        <option value="5">5</option>
        <option value="10">10</option>
      </select>
    </label>
  </nav>
  <p class="example-feedback">{{ 'showcase.table.hint' | rvTranslate }}</p>
</div>
