<a
  [href]="href"
  target="_blank"
  rel="noopener noreferrer"
  [class]="linkClass()"
  [attr.title]="variant() === 'icon' ? label() : null"
>
  <svg
    viewBox="0 0 24 24"
    fill="currentColor"
    aria-hidden="true"
    focusable="false"
    class="size-4 shrink-0"
  >
    <path
      d="M12 .5C5.73.5.5 5.73.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.55v-1.93c-3.2.7-3.88-1.54-3.88-1.54-.53-1.33-1.29-1.69-1.29-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.26 5.68.41.35.78 1.04.78 2.1v3.12c0 .3.21.66.8.55A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"
    />
  </svg>

  @if (variant() === 'icon') {
    <span class="sr-only">{{ accessibleLabel() }}</span>
  } @else {
    <span>{{ label() }}</span>
    @if (newTabLabel(); as hint) {
      <span class="sr-only">({{ hint }})</span>
    }
  }
</a>
