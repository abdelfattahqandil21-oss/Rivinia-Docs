<button
  type="button"
  class="copy-button"
  [attr.aria-label]="accessibleName()"
  [attr.title]="accessibleName()"
  [attr.data-state]="status()"
  (click)="copy()"
>
  <svg
    class="copy-icon"
    [class.is-visible]="status() !== 'copied'"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <rect x="8" y="8" width="12" height="12" rx="2" />
    <path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" />
  </svg>
  <svg
    class="success-icon"
    [class.is-visible]="status() === 'copied'"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path d="m5 12 4 4L19 6" />
  </svg>
  <span class="visually-hidden" aria-live="polite" aria-atomic="true">{{ announcement() }}</span>
</button>
