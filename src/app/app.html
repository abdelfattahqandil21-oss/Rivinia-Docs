<app-progress-bar
  appProgressBar
  [value]="progressValue()"
  [visible]="progressVisible()"
  [label]="loadingLabel()"
/>

<a
  [href]="skipLinkHref()"
  (click)="focusMainContent()"
  class="sr-only focus:not-sr-only focus:fixed focus:start-4 focus:top-4 focus:z-50 focus:inline-flex focus:h-11 focus:items-center focus:rounded-lg focus:bg-rv-accent focus:px-4 focus:text-sm focus:font-semibold focus:text-rv-bg focus:outline-2 focus:outline-offset-2 focus:outline-rv-accent"
>
  {{ skipLabel() }}
</a>

<app-navbar />

<main id="main-content" tabindex="-1" class="outline-none">
  <router-outlet />
</main>
