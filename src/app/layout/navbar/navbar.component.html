<header class="border-b border-rv-border/70 bg-rv-bg/85 backdrop-blur-xl">
  <div class="flex h-16 w-full items-center gap-2 px-4 sm:px-6 lg:px-8">
    <a
      routerLink="/"
      class="group -ms-2 flex items-center gap-3 rounded-xl px-2 py-1.5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rv-accent"
    >
      <app-brand-mark
        class="size-9 shrink-0 transition-transform duration-300 ease-out group-hover:scale-105 motion-reduce:transition-none"
      />
      <span class="flex flex-col leading-none">
        <span lang="en" class="font-serif text-xl font-semibold tracking-[0.16em] text-rv-fg"
          >RIVINIA</span
        >
        <span
          lang="en"
          class="mt-1 text-[0.6rem] font-medium uppercase tracking-[0.32em] text-rv-muted"
        >
          Docs
        </span>
      </span>
    </a>

    <nav class="ms-8 hidden items-center gap-1 md:flex" [attr.aria-label]="primaryNavLabel()">
      @for (link of links(); track link.id) {
        <a
          [routerLink]="link.path"
          class="relative rounded-lg px-3 py-2 text-sm font-medium transition-colors duration-150 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rv-accent motion-reduce:transition-none"
          [class]="isActive(link) ? 'text-rv-fg' : 'text-rv-muted hover:text-rv-fg'"
          [attr.aria-current]="isActive(link) ? 'page' : null"
        >
          {{ i18n.translate(link.labelKey) }}
          <span
            aria-hidden="true"
            class="absolute inset-x-3 -bottom-0.5 h-0.5 origin-center rounded-full bg-rv-accent transition duration-200 ease-out motion-reduce:transition-none"
            [class.scale-x-0]="!isActive(link)"
            [class.opacity-0]="!isActive(link)"
          ></span>
        </a>
      }
    </nav>

    <div class="ms-auto flex items-center gap-2">
      <app-preferences-menu (opened)="closeMenu()" />

      @if (docsRoute()) {
        <button
          type="button"
          class="docs-menu-button hidden min-h-11 items-center gap-2 rounded-lg border border-rv-border px-3 text-sm font-medium text-rv-fg hover:border-rv-accent hover:text-rv-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rv-accent max-[1023px]:inline-flex max-[399px]:w-11 max-[399px]:justify-center max-[399px]:px-0"
          aria-controls="rv-docs-menu-dialog"
          [attr.aria-expanded]="docsMenuOpen()"
          [attr.aria-label]="docsMenuLabel()"
          (click)="openDocsMenu($event)"
        >
          <app-icon name="panel-left-open" [size]="18" aria-hidden="true" />
          <span class="max-[399px]:sr-only">{{ i18n.translate('docs.menu.short') }}</span>
        </button>
      }

      <a
        routerLink="/docs"
        class="hidden h-10 items-center rounded-lg bg-rv-accent px-4 text-sm font-semibold text-rv-bg transition-opacity duration-150 hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rv-accent motion-reduce:transition-none lg:inline-flex"
      >
        {{ getStartedLabel() }}
      </a>

      <div class="hidden md:block">
        <app-github-link variant="icon" [label]="githubLabel()" [newTabLabel]="newTabLabel()" />
      </div>

      <button
        #menuButton
        type="button"
        class="inline-grid size-11 place-items-center rounded-lg border border-rv-border text-rv-fg transition-colors duration-150 hover:border-rv-accent hover:text-rv-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rv-accent motion-reduce:transition-none md:hidden"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-controls]="mobileNavId"
        [attr.aria-label]="menuOpen() ? closeMenuLabel() : openMenuLabel()"
        (click)="toggleMenu($event)"
      >
        <app-icon [name]="menuOpen() ? 'x' : 'menu'" [size]="20" aria-hidden="true" />
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div
      #menuPanel
      [id]="mobileNavId"
      class="mobile-panel absolute inset-x-0 top-full max-h-[calc(100dvh-4rem)] overflow-y-auto border-b border-rv-border bg-rv-bg shadow-xl md:hidden"
    >
      <nav class="w-full px-4 py-4 sm:px-6" [attr.aria-label]="mobileNavLabel()">
        <ul class="flex flex-col gap-1">
          @for (link of links(); track link.id) {
            <li>
              <a
                [routerLink]="link.path"
                (click)="closeMenu()"
                class="flex min-h-12 items-center justify-between rounded-lg border-s-2 px-3 text-base font-medium transition-colors duration-150 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rv-accent motion-reduce:transition-none"
                [class]="
                  isActive(link)
                    ? 'border-rv-accent text-rv-fg'
                    : 'border-transparent text-rv-fg hover:bg-rv-fg/5'
                "
                [attr.aria-current]="isActive(link) ? 'page' : null"
              >
                {{ i18n.translate(link.labelKey) }}
                <app-icon
                  name="arrow-right"
                  [size]="16"
                  class="opacity-50 rtl:-scale-x-100"
                  aria-hidden="true"
                />
              </a>
            </li>
          }
        </ul>

        <a
          routerLink="/docs"
          (click)="closeMenu()"
          class="mt-4 flex h-12 items-center justify-center rounded-lg bg-rv-accent text-sm font-semibold text-rv-bg transition-opacity duration-150 hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rv-accent motion-reduce:transition-none"
        >
          {{ getStartedLabel() }}
        </a>

        <app-github-link
          class="mt-2 w-full"
          variant="row"
          [label]="githubLabel()"
          [newTabLabel]="newTabLabel()"
        />
      </nav>
    </div>
  }
</header>
